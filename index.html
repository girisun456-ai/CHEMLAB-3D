<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemLab 3D - Virtual Chemistry Lab</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-extrabold text-blue-400 tracking-wide">ChemLab 3D</h1>
            <nav class="space-x-4 text-sm font-medium">
                <a href="#visualizer" class="hover:text-blue-400 transition">3D Visualizer</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-6 space-y-8">
        
        <!-- 3D Molecule Visualizer Section -->
        <section id="visualizer" class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <span>🧊</span> 3D Molecule Visualizer (Powered by PubChem)
            </h2>

            <!-- Search Box Controls -->
            <div class="mb-4 flex gap-2">
                <input 
                    type="text" 
                    id="molecule-search-input" 
                    placeholder="Enter molecule name (e.g. Aspirin, Glucose, Caffeine, Ethanol)..." 
                    class="w-full p-3 rounded-lg bg-slate-900 text-white border border-slate-700 focus:outline-none focus:border-blue-500 placeholder-slate-500"
                />
                <button 
                    onclick="searchMolecule()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-lg transition shadow-lg hover:shadow-blue-500/20"
                >
                    Search
                </button>
            </div>

            <!-- 3D Canvas Container -->
            <div id="molecule-canvas-container" class="w-full h-96 rounded-xl bg-slate-950 overflow-hidden relative shadow-inner border border-slate-800"></div>

            <!-- Molecule Info Box -->
            <div id="molecule-info" class="mt-4 p-4 bg-slate-900/80 rounded-xl border border-slate-700/80"></div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-400">
        <p>ChemLab 3D &copy; 2026 | Built with Three.js & PubChem API</p>
    </footer>

    <!-- Link to external script.js -->
    <script src="script.js"></script>
</body>
</html>
