<div class="mb-4 flex gap-2">
    <input 
        type="text" 
        id="molecule-search-input" 
        placeholder="Enter molecule (e.g. Aspirin, Glucose, Caffeine, Ethanol)..." 
        class="w-full p-3 rounded-lg bg-slate-800 text-white border border-slate-700 focus:outline-none focus:border-blue-500"
    />
    <button 
        onclick="searchMolecule()" 
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-3 rounded-lg transition"
    >
        Search
    </button>
</div>

<div id="molecule-canvas-container" class="w-full h-96 rounded-lg bg-slate-900 overflow-hidden"></div>

<div id="molecule-info" class="mt-4 p-4 bg-slate-800/60 rounded-lg border border-slate-700"></div>
